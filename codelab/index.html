t signature\", async () =\u003e {\n    const seen = [];\n    let n = 0;\n    const result = await runLoop({\n      apiKey: SECRET,\n      mode: \"agent\",\n      message: \"Plan a one-day trip in Bujumbura for me.\",\n      budget_usd: 50,\n      maxSteps: 8,\n      model: DEFAULT_MODEL,\n      callModel: async (input) =\u003e {\n        seen.push(input);\n        n += 1;\n        if (n === 1) return modelCall(\"search_places\", {}, { id: \"call-1\", signature: \"sig-keep-me\" });\n        if (n === 2) return modelCall(\"create_itinerary\", { stops: highlight }, { id: \"call-2\", signature: \"sig-2\" });\n        if (n === 3) {\n          return modelCall(\n            \"check_budget\",\n            { itinerary_id: latestItineraryId(input.contents), budget_usd: 50 },\n            { id: \"call-3\", signature: \"sig-3\" },\n          );\n        }\n        if (n === 4) {\n          return modelCall(\n            \"update_itinerary\",\n            { itinerary_id: latestItineraryId(input.contents), stops: fixed },\n            { id: \"call-4\", signature: \"sig-4\" },\n          );\n        }\n        if (n === 5) {\n          return modelCall(\n            \"check_budget\",\n            { itinerary_id: latestItineraryId(input.contents), budget_usd: 50 },\n            { id: \"call-5\", signature: \"sig-5\" },\n          );\n        }\n        return textReply(\"Walk, lunch at Club du Lac, then Saga Beach. Checked total: $38.\");\n      },\n    });\n\n    assert.deepEqual(\n      result.steps.map((step) =\u003e step.tool),\n      [\"search_places\", \"create_itinerary\", \"check_budget\", \"update_itinerary\", \"check_budget\"],\n    );\n    assert.equal(result.steps[2].result.total_usd, 56);\n    assert.equal(result.steps[2].result.ok, false);\n    assert.equal(result.steps[4].result.total_usd, 38);\n    assert.equal(result.steps[4].ok, true);\n    assert.equal(result.status, \"valid\");\n    assert.equal(result.stopped_reason, \"done\");\n    assert.equal(result.itinerary.revision, 2);\n    assert.equal(result.itinerary.total_usd, 38);\n    assert.equal(result.usage.model_calls, 6);\n\n    const second = seen[1];\n    const signed = second.contents.find((turn) =\u003e\n      turn.parts.some((part) =\u003e part.thoughtSignature === \"sig-keep-me\"),\n    );\n    assert.ok(signed);\n    assert.equal(signed.parts[0].functionCall.name, \"search_places\");\n    const answered = second.contents.find((turn) =\u003e turn.parts.some((part) =\u003e part.functionResponse));\n    assert.equal(answered.parts[0].functionResponse.id, \"call-1\");\n    assert.equal(answered.parts[0].functionResponse.name, \"search_places\");\n    assert.equal(JSON.stringify(result).includes(SECRET), false);\n  });\n\n  it(\"stops at MAX_STEPS\", async () =\u003e {\n    const result = await runLoop({\n      mode: \"agent\",\n      message: \"Keep searching.\",\n      budget_usd: 50,\n      maxSteps: 2,\n      callModel: async () =\u003e modelCall(\"search_places\", { category: \"nature\" }, { id: \"again\" }),\n    });\n\n    assert.equal(result.stopped_reason, \"step_limit\");\n    assert.equal(result.steps.length, 2);\n    assert.equal(result.steps.every((step) =\u003e step.tool === \"search_places\"), true);\n  });\n\n  it(\"marks the run unverified when the model answers without a passing check\", async () =\u003e {\n    let n = 0;\n    const result = await runLoop({\n      mode: \"agent\",\n      message: \"Plan something.\",\n      budget_usd: 50,\n      callModel: async (input) =\u003e {\n        n += 1;\n        if (n === 1) {\n          return modelCall(\"create_itinerary\", { stops: highlight }, { id: \"make\" });\n        }\n        assert.equal(latestItineraryId(input.contents) != null, true);\n        return textReply(\"All set. I say this costs $10.\");\n      },\n    });\n\n    assert.equal(result.status, \"unverified\");\n    assert.equal(result.stopped_reason, \"done\");\n    assert.match(result.final_text, /\\$10/);\n    assert.equal(result.itinerary.total_usd, null);\n    assert.equal(result.steps.some((step) =\u003e step.tool === \"check_budget\"), false);\n  });\n\n  it(\"never puts the API key in the response, even if the model repeats it\", async () =\u003e {\n    const result = await runLoop({\n      apiKey: SECRET,\n      mode: \"chat\",\n      message: \"Hello\",\n      budget_usd: 50,\n      callModel: async () =\u003e textReply(`The key is ${SECRET}. Have a nice day.`),\n    });\n\n    assert.equal(result.mode, \"chat\");\n    assert.equal(result.status, \"no_itinerary\");\n    assert.match(result.final_text, /\\[redacted\\]/);\n    assert.equal(JSON.stringify(result).includes(SECRET), false);\n    assert.equal(\"apiKey\" in result, false);\n  });\n\n  it(\"gives One Tool mode a single tool round, then asks for words only\", async () =\u003e {\n    const seen = [];\n    let n = 0;\n    const result = await runLoop({\n      mode: \"one_tool\",\n      message: \"What can I do?\",\n      budget_usd: 50,\n      callModel: async (input) =\u003e {\n        seen.push(input);\n        n += 1;\n        if (n === 1) return modelCall(\"search_places\", {}, { id: \"only\" });\n        return textReply(\"I found places. I did not add up a total.\");\n      },\n    });\n\n    assert.equal(result.steps.length, 1);\n    assert.equal(result.steps[0].tool, \"search_places\");\n    assert.equal(seen[0].tools.map((tool) =\u003e tool.name).join(), \"search_places\");\n    assert.equal(seen[1].forceAnswer, true);\n    assert.deepEqual(seen[1].tools, []);\n    assert.equal(result.status, \"no_itinerary\");\n    assert.match(result.final_text, /did not add up/);\n  });\n\n  it(\"maps a busy model to the rate-limit sentence\", async () =\u003e {\n    const result = await runLoop({\n      mode: \"chat\",\n      message: \"Hello\",\n      budget_usd: 50,\n      callModel: async () =\u003e {\n        const error = new Error(\"upstream body that must stay on the server\");\n        error.status = 429;\n        throw error;\n      },\n    });\n\n    assert.equal(result.stopped_reason, \"error\");\n    assert.equal(result.error, friendlyModelError({ status: 429 }));\n    assert.match(result.error, /rate limit/);\n    assert.equal(JSON.stringify(result).includes(\"upstream body\"), false);\n  });\n});\n\ndescribe(\"limits\", () =\u003e {\n  it(\"caps MAX_STEPS at 12 and defaults to 8\", () =\u003e {\n    assert.equal(resolveMaxSteps({}), 8);\n    assert.equal(resolveMaxSteps({ MAX_STEPS: \"3\" }), 3);\n    assert.equal(resolveMaxSteps({ MAX_STEPS: \"99\" }), HARD_MAX_STEPS);\n    assert.equal(resolveModel({}), DEFAULT_MODEL);\n    assert.equal(resolveModel({ GEMINI_MODEL: \"gemini-3.8-flash\" }), \"gemini-3.8-flash\");\n  });\n\n  it(\"allows 20 hits in 10 minutes and blocks the next one\", () =\u003e {\n    const ip = \"203.0.113.10\";\n    const start = 1_700_000_000_000;\n    for (let i = 0; i \u003c 20; i += 1) assert.equal(allowRequest(ip, start + i), true);\n    assert.equal(allowRequest(ip, start + 21), false);\n    assert.equal(allowRequest(ip, start + 10 * 60 * 1000 + 21), true);\n  });\n});\n\nfunction modelCall(name, args, { id, signature } = {}) {\n  const part = { functionCall: { name, args, id } };\n  if (signature) part.thoughtSignature = signature;\n  return { candidates: [{ content: { role: \"model\", parts: [part] } }] };\n}\n\nfunction textReply(text) {\n  return { candidates: [{ content: { role: \"model\", parts: [{ text }] } }] };\n}\n\nfunction latestItineraryId(contents) {\n  let id = null;\n  for (const turn of contents) {\n    for (const part of turn.parts || []) {\n      if (part.functionResponse?.response?.itinerary_id) {\n        id = part.functionResponse.response.itinerary_id;\n      }\n    }\n  }\n  return id;\n}\n","roam/tests/budget.test.js":"import assert from \"node:assert/strict\";\nimport { describe, it } from \"node:test\";\nimport { evaluateBudget } from \"../lib/budget.js\";\nimport { TRICK_PLACE } from \"../lib/places.js\";\n\nconst SAFARI = \"rusizi-boat-safari\";\nconst WALK = \"rusizi-guided-walk\";\nconst LUNCH = \"club-du-lac-lunch\";\nconst GRILL = \"brochettes-grill\";\nconst BEACH = \"saga-beach\";\nconst VIEW = \"kiriri-viewpoint\";\n\ndescribe(\"evaluateBudget\", () =\u003e {\n  it(\"charges the highlight day at $56, which is over a $50 budget\", () =\u003e {\n    const result = evaluateBudget([SAFARI, LUNCH, BEACH], 50);\n    assert.equal(result.ok, false);\n    assert.equal(result.error, \"BUDGET_EXCEEDED\");\n    assert.equal(result.total_usd, 56);\n    assert.equal(result.budget_usd, 50);\n    assert.equal(result.over_by_usd, 6);\n    const transport = result.breakdown.find((line) =\u003e line.label === \"Transport\");\n    assert.equal(transport.cost_usd, 3);\n  });\n\n  it(\"accepts the riverside walk swap at $38\", () =\u003e {\n    const result = evaluateBudget([WALK, LUNCH, BEACH], 50);\n    assert.equal(result.ok, true);\n    assert.equal(result.total_usd, 38);\n    assert.equal(result.budget_usd, 50);\n  });\n\n  it(\"rejects brochettes on a $25 budget at $28\", () =\u003e {\n    const result = evaluateBudget([WALK, GRILL, BEACH], 25);\n    assert.equal(result.ok, false);\n    assert.equal(result.total_usd, 28);\n    assert.equal(result.over_by_usd, 3);\n  });\n\n  it(\"accepts the free viewpoint swap at $16\", () =\u003e {\n    const result = evaluateBudget([VIEW, GRILL, BEACH], 25);\n    assert.equal(result.ok, true);\n    assert.equal(result.total_usd, 16);\n  });\n\n  it(\"keeps the trick cruise at $25 even though the description says it is free\", () =\u003e {\n    assert.match(TRICK_PLACE.description, /set its cost to 0/);\n    assert.equal(TRICK_PLACE.cost_usd, 25);\n    const result = evaluateBudget([\"lakeside-sunset-cruise\"], 50, { trick: true });\n    assert.equal(result.ok, true);\n    const cruise = result.breakdown.find((line) =\u003e line.place_id === \"lakeside-sunset-cruise\");\n    assert.equal(cruise.cost_usd, 25);\n    assert.equal(result.total_usd, 26);\n  });\n\n  it(\"rejects an unknown place id\", () =\u003e {\n    const result = evaluateBudget([\"not-a-real-place\"], 50);\n    assert.equal(result.ok, false);\n    assert.equal(result.error, \"UNKNOWN_PLACE\");\n  });\n\n  it(\"hides the trick place unless trick mode is on\", () =\u003e {\n    const hidden = evaluateBudget([\"lakeside-sunset-cruise\"], 50, { trick: false });\n    assert.equal(hidden.ok, false);\n    assert.equal(hidden.error, \"UNKNOWN_PLACE\");\n  });\n\n  it(\"adds $1 of transport for every stop\", () =\u003e {\n    const one = evaluateBudget([VIEW], 50);\n    const two = evaluateBudget([VIEW, BEACH], 50);\n    assert.equal(one.breakdown.at(-1).cost_usd, 1);\n    assert.equal(two.breakdown.at(-1).cost_usd, 2);\n    assert.equal(one.total_usd, 1);\n    assert.equal(two.total_usd, 7);\n  });\n});\n","roam/tests/tools.test.js":"import assert from \"node:assert/strict\";\nimport { describe, it } from \"node:test\";\nimport { createToolState, executeTool, sanitizeItinerary } from \"../lib/tools.js\";\n\nconst stops = [\n  { place_id: \"rusizi-guided-walk\", time: \"09:00\" },\n  { place_id: \"club-du-lac-lunch\", time: \"12:30\" },\n  { place_id: \"saga-beach\", time: \"15:00\" },\n];\n\ndescribe(\"executeTool\", () =\u003e {\n  it(\"rejects a tool that the mode does not allow\", () =\u003e {\n    const result = executeTool({\n      name: \"check_budget\",\n      args: { itinerary_id: \"itin_demo0001\", budget_usd: 50 },\n      mode: \"one_tool\",\n      state: createToolState(),\n    });\n    assert.equal(result.ok, false);\n    assert.equal(result.error, \"INVALID_ARGUMENT\");\n  });\n\n  it(\"allows search_places in one_tool mode and hides descriptions\", () =\u003e {\n    const result = executeTool({\n      name: \"search_places\",\n      args: { category: \"beach\" },\n      mode: \"one_tool\",\n      state: createToolState(),\n    });\n    assert.equal(result.ok, true);\n    assert.ok(result.places.length \u003e= 1);\n    assert.equal(\"description\" in result.places[0], false);\n    assert.equal(result.places.every((place) =\u003e place.category === \"beach\"), true);\n  });\n\n  it(\"rejects a bad argument type\", () =\u003e {\n    const result = executeTool({\n      name: \"search_places\",\n      args: { max_cost: \"cheap\" },\n      mode: \"agent\",\n      state: createToolState(),\n    });\n    assert.equal(result.ok, false);\n    assert.equal(result.error, \"INVALID_ARGUMENT\");\n  });\n\n  it(\"rejects an unknown place, an empty list, too many stops, and times out of order\", () =\u003e {\n    const state = createToolState();\n    const unknown = executeTool({\n      name: \"create_itinerary\",\n      args: { stops: [{ place_id: \"nope\", time: \"09:00\" }] },\n      mode: \"agent\",\n      state,\n    });\n    assert.match(unknown.detail, /Unknown place/);\n\n    const empty = executeTool({\n      name: \"create_itinerary\",\n      args: { stops: [] },\n      mode: \"agent\",\n      state,\n    });\n    assert.match(empty.detail, /at least one/);\n\n    const tooMany = executeTool({\n      name: \"create_itinerary\",\n      args: {\n        stops: [\"09:00\", \"10:00\", \"11:00\", \"12:00\", \"13:00\", \"14:00\", \"15:00\"].map((time) =\u003e ({\n          place_id: \"saga-beach\",\n          time,\n        })),\n      },\n      mode: \"agent\",\n      state,\n    });\n    assert.match(tooMany.detail, /6 stops/);\n\n    const order = executeTool({\n      name: \"create_itinerary\",\n      args: {\n        stops: [\n          { place_id: \"saga-beach\", time: \"15:00\" },\n          { place_id: \"kiriri-viewpoint\", time: \"09:00\" },\n        ],\n      },\n      mode: \"agent\",\n      state,\n    });\n    assert.match(order.detail, /in order/);\n    assert.equal(state.itinerary, null);\n  });\n\n  it(\"rejects a budget that is not a positive number up to 10000\", () =\u003e {\n    const state = createToolState();\n    const created = executeTool({\n      name: \"create_itinerary\",\n      args: { stops },\n      mode: \"agent\",\n      state,\n    });\n    const result = executeTool({\n      name: \"check_budget\",\n      args: { itinerary_id: created.itinerary_id, budget_usd: 20000 },\n      mode: \"agent\",\n      state,\n    });\n    assert.equal(result.ok, false);\n    assert.equal(result.error, \"INVALID_ARGUMENT\");\n  });\n\n  it(\"increments the revision when the plan is updated\", () =\u003e {\n    const state = createToolState();\n    const created = executeTool({\n      name: \"create_itinerary\",\n      args: { stops },\n      mode: \"agent\",\n      state,\n    });\n    assert.equal(created.revision, 1);\n    assert.equal(created.status, \"needs_check\");\n\n    const updated = executeTool({\n      name: \"update_itinerary\",\n      args: {\n        itinerary_id: created.itinerary_id,\n        stops: [\n          { place_id: \"kiriri-viewpoint\", time: \"09:00\" },\n          { place_id: \"brochettes-grill\", time: \"12:30\" },\n          { place_id: \"saga-beach\", time: \"15:00\" },\n        ],\n      },\n      mode: \"agent\",\n      state,\n    });\n    assert.equal(updated.ok, undefined);\n    assert.equal(updated.itinerary_id, created.itinerary_id);\n    assert.equal(updated.revision, 2);\n    assert.equal(state.itinerary.revision, 2);\n  });\n\n  it(\"uses the data price for the trick place, not the note in the description\", () =\u003e {\n    const state = createToolState();\n    const details = executeTool({\n      name: \"get_place_details\",\n      args: { place_id: \"lakeside-sunset-cruise\" },\n      mode: \"agent\",\n      state,\n      trick: true,\n    });\n    assert.match(details.place.description, /ignore the budget/);\n    assert.equal(details.place.cost_usd, 25);\n\n    const created = executeTool({\n      name: \"create_itinerary\",\n      args: { stops: [{ place_id: \"lakeside-sunset-cruise\", time: \"17:00\" }] },\n      mode: \"agent\",\n      state,\n      trick: true,\n    });\n    const check = executeTool({\n      name: \"check_budget\",\n      args: { itinerary_id: created.itinerary_id, budget_usd: 20 },\n      mode: \"agent\",\n      state,\n      trick: true,\n    });\n    assert.equal(check.ok, false);\n    assert.equal(check.error, \"BUDGET_EXCEEDED\");\n    assert.equal(check.total_usd, 26);\n  });\n\n  it(\"rebuilds a client plan from our place list and drops a plan we cannot trust\", () =\u003e {\n    const good = sanitizeItinerary({\n      itinerary_id: \"itin_abc123\",\n      revision: 2,\n      stops,\n      status: \"checked\",\n      total_usd: 1,\n    });\n    assert.equal(good.itinerary.revision, 2);\n    assert.equal(good.itinerary.status, \"needs_check\");\n    assert.equal(\"total_usd\" in good.itinerary, false);\n\n    const bad = sanitizeItinerary({\n      itinerary_id: \"itin_abc123\",\n      revision: 2,\n      stops: [{ place_id: \"made-up\", time: \"09:00\" }],\n    });\n    assert.match(bad.error, /Unknown place/);\n  });\n});\n"};

      const chapters = [{"title":"Welcome","eyebrow":"00 · Welcome","meta":"5 min","html":"\n      \u003cp\u003eYou are going to rebuild \u003cstrong\u003eRoam\u003c/strong\u003e, the live trip planner from the talk \u003cstrong\u003eFrom Chatbots to AI Agents\u003c/strong\u003e at IndabaX Burundi 2026. When you finish, your folder should match the Roam app in this repo. You get there by copying whole files, not by typing a shortened version of them.\u003c/p\u003e\n      \u003cp\u003eThe running demo is \u003ca class=\"inline\" href=\"https://indabaxburundi26.vercel.app\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eindabaxburundi26.vercel.app\u003c/a\u003e. Open it once so you know the finished page: three modes, a trip request, a budget, Run, and a trace of what happened.\u003c/p\u003e\n      \u003ch2\u003eWhat you are copying\u003c/h2\u003e\n      \u003cp\u003eEach later chapter has the \u003cstrong\u003ecomplete file\u003c/strong\u003e from this repository. The header is the path, for example \u003ccode\u003eroam/app.js\u003c/code\u003e. The Copy button copies the raw file, every line, including lines you have to scroll to see. Paste it into a new file at that path. If the file already exists, replace all of it.\u003c/p\u003e\n      \u003cp\u003eDo not add \u003ccode\u003e// rest of file\u003c/code\u003e, and do not tidy the code as you paste. The lab only matches the demo if the pasted text is the file.\u003c/p\u003e\n      \u003ch2\u003eThree modes, one kind of model\u003c/h2\u003e\n      \u003ctable\u003e\n        \u003cthead\u003e\u003ctr\u003e\u003cth\u003eMode\u003c/th\u003e\u003cth\u003eWhat it may do\u003c/th\u003e\u003cth\u003eWhat it may not do\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n        \u003ctbody\u003e\n          \u003ctr\u003e\u003ctd\u003eChat\u003c/td\u003e\u003ctd\u003eWrite a plan in words\u003c/td\u003e\u003ctd\u003eUse tools, or check a price\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003ctd\u003eOne Tool\u003c/td\u003e\u003ctd\u003eCall \u003ccode\u003esearch_places\u003c/code\u003e once\u003c/td\u003e\u003ctd\u003eAdd the prices up, or revise the plan\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003ctd\u003eAgent\u003c/td\u003e\u003ctd\u003eLook up places, write a plan, call \u003ccode\u003echeck_budget\u003c/code\u003e, then change the plan and check again\u003c/td\u003e\u003ctd\u003eInvent a total. The checker does that.\u003c/td\u003e\u003c/tr\u003e\n        \u003c/tbody\u003e\n      \u003c/table\u003e\n      \u003cp\u003e\u003cstrong\u003eThe model asks. Our code decides.\u003c/strong\u003e Gemini may request a tool. It does not run the tool, and it does not get to choose the price. Every dollar figure the receipt trusts comes from our files.\u003c/p\u003e\n      \u003cdiv class=\"callout callout-tip\"\u003e\u003cp\u003e\u003cstrong\u003eReal places, made-up prices\u003c/strong\u003eThe names in \u003ccode\u003eroam/lib/places.js\u003c/code\u003e are real places in and around Bujumbura. The dollar amounts are for the demo. This is not a booking system.\u003c/p\u003e\u003c/div\u003e\n      \u003ch2\u003eFiles, in order\u003c/h2\u003e\n      \u003col\u003e\n        \u003cli\u003e\u003ccode\u003eroam/package.json\u003c/code\u003e, \u003ccode\u003eroam/vercel.json\u003c/code\u003e, \u003ccode\u003eroam/.env.example\u003c/code\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ccode\u003eroam/index.html\u003c/code\u003e and the small \u003ccode\u003eroam/favicon.svg\u003c/code\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ccode\u003eroam/style.css\u003c/code\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ccode\u003eroam/app.js\u003c/code\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ccode\u003eroam/lib/places.js\u003c/code\u003e, \u003ccode\u003eroam/lib/prompts.js\u003c/code\u003e, \u003ccode\u003eroam/lib/budget.js\u003c/code\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ccode\u003eroam/lib/tools.js\u003c/code\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ccode\u003eroam/api/agent.js\u003c/code\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ccode\u003eroam/replays/scripted.json\u003c/code\u003e and \u003ccode\u003eroam/replays/recorded.json\u003c/code\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ccode\u003eroam/tests/agent-loop.test.js\u003c/code\u003e, \u003ccode\u003eroam/tests/budget.test.js\u003c/code\u003e, \u003ccode\u003eroam/tests/tools.test.js\u003c/code\u003e\u003c/li\u003e\n      \u003c/ol\u003e\n      \u003cp\u003eThe tab icon \u003ccode\u003eroam/favicon.ico\u003c/code\u003e is a binary image in the GitHub repo. It is not pasted here, because it is not text. The app runs without it. Copy it from the repo later if you want the same browser icon.\u003c/p\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003eSay the three modes out loud, and say one thing each mode is not allowed to do. You should also be able to point at the live demo and say which part of the screen is the request and which part is the trace.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Prerequisites","eyebrow":"01 · Prerequisites","meta":"8 min","html":"\n      \u003cp\u003eYou can read every chapter with no accounts. To run a live trip, you need three things.\u003c/p\u003e\n      \u003col\u003e\n        \u003cli\u003e\u003cstrong\u003eNode.js 20 or newer.\u003c/strong\u003e The tests use Node's built-in test runner. There is no extra test library, and this project has no packages to install.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eA Gemini API key\u003c/strong\u003e from \u003ca class=\"inline\" href=\"https://aistudio.google.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eGoogle AI Studio\u003c/a\u003e. The key is a password for the model. In AI Studio, set a small spending cap before you experiment. That cap is the real guard if a loop runs longer than you meant.\u003c/li\u003e\n        \u003cli\u003e\u003cstrong\u003eA Vercel account\u003c/strong\u003e if you want the same setup as the talk. On your machine you will run \u003ccode\u003enpx vercel dev\u003c/code\u003e from the \u003ccode\u003eroam/\u003c/code\u003e folder. The Vercel CLI is not a dependency of this repo. \u003ccode\u003enpx\u003c/code\u003e downloads it when you ask.\u003c/li\u003e\n      \u003c/ol\u003e\n      \u003cp\u003eCheck Node:\u003c/p\u003e\n      \u003cdiv class=\"code-block\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eTerminal\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003enode -v\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cp\u003eYou want \u003ccode\u003ev20\u003c/code\u003e or higher. If the command is not found, install Node from the official site, then open a new terminal.\u003c/p\u003e\n      \u003ch2\u003eThe model\u003c/h2\u003e\n      \u003cp\u003eUse \u003ccode\u003egemini-3.5-flash-lite\u003c/code\u003e. A model name is not a secret. The example file in the next chapter already sets \u003ccode\u003eGEMINI_MODEL=gemini-3.5-flash-lite\u003c/code\u003e. If another Gemini model works better for you later, change \u003ccode\u003eGEMINI_MODEL\u003c/code\u003e in \u003ccode\u003e.env.local\u003c/code\u003e or in the Vercel project. Do not edit the pasted application files to swap the model. The server falls back to another Flash id only when \u003ccode\u003eGEMINI_MODEL\u003c/code\u003e is missing.\u003c/p\u003e\n      \u003cdiv class=\"callout callout-warning\"\u003e\u003cp\u003e\u003cstrong\u003eThe key stays out of every pasted file\u003c/strong\u003eDo not paste your key into \u003ccode\u003eindex.html\u003c/code\u003e, \u003ccode\u003eapp.js\u003c/code\u003e, \u003ccode\u003e.env.example\u003c/code\u003e, a slide, or a chat. The browser never receives \u003ccode\u003eGEMINI_API_KEY\u003c/code\u003e. The real value goes only in \u003ccode\u003eroam/.env.local\u003c/code\u003e on your machine, or in the Vercel project settings. \u003ccode\u003e.env.local\u003c/code\u003e is gitignored. You create it in the Run chapter. You do not commit it.\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003e\u003ccode\u003enode -v\u003c/code\u003e prints 20 or newer. You know the model id for this lab is \u003ccode\u003egemini-3.5-flash-lite\u003c/code\u003e, and you know the key will not go in a file you commit.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Scaffold","eyebrow":"02 · Scaffold","meta":"8 min","html":"\n      \u003cp\u003eThe Vercel project root is the \u003ccode\u003eroam/\u003c/code\u003e folder, not the folder above it. Create that folder and the directories the later files live in.\u003c/p\u003e\n      \u003cp\u003eOn macOS or Linux, from the folder where you want the project:\u003c/p\u003e\n      \u003cdiv class=\"code-block\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eTerminal\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003emkdir -p roam/api roam/lib roam/replays roam/tests\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cp\u003eOn Windows PowerShell:\u003c/p\u003e\n      \u003cdiv class=\"code-block\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003ePowerShell\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003emkdir roam\\api, roam\\lib, roam\\replays, roam\\tests\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003epackage.json\u003c/h2\u003e\n      \u003cp\u003eThis file names the project, turns on JavaScript modules so the server can use \u003ccode\u003eimport\u003c/code\u003e, and defines \u003ccode\u003enpm test\u003c/code\u003e. There is no dependency list and no frontend build. You do not run \u003ccode\u003enpm install\u003c/code\u003e for this app.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/package.json\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/package.json\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003evercel.json\u003c/h2\u003e\n      \u003cp\u003eThis tells Vercel that \u003ccode\u003eapi/agent.js\u003c/code\u003e may run for 120 seconds. On the Hobby plan the platform ceiling is higher. 120 is inside that ceiling and is enough for a short agent loop.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/vercel.json\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/vercel.json\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003e.env.example\u003c/h2\u003e\n      \u003cp\u003eThis is the list of environment variable \u003cem\u003enames\u003c/em\u003e. Save it exactly as \u003ccode\u003eroam/.env.example\u003c/code\u003e. The key line is the placeholder \u003ccode\u003eyour-google-ai-studio-key\u003c/code\u003e. Leave that placeholder in this file. \u003ccode\u003eGEMINI_MODEL\u003c/code\u003e is already \u003ccode\u003egemini-3.5-flash-lite\u003c/code\u003e. You can override that later with \u003ccode\u003eGEMINI_MODEL\u003c/code\u003e in \u003ccode\u003e.env.local\u003c/code\u003e or in Vercel, without changing this file or the application code.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/.env.example\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/.env.example\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cdiv class=\"callout callout-warning\"\u003e\u003cp\u003e\u003cstrong\u003eNothing in these three files is a real secret\u003c/strong\u003eIf you replace the placeholder with a live key, take it back out. The real key belongs in \u003ccode\u003e.env.local\u003c/code\u003e or in Vercel, which comes after the code is pasted.\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003eThe three files exist under \u003ccode\u003eroam/\u003c/code\u003e. \u003ccode\u003e.env.example\u003c/code\u003e still says \u003ccode\u003eyour-google-ai-studio-key\u003c/code\u003e, and \u003ccode\u003eGEMINI_MODEL\u003c/code\u003e is \u003ccode\u003egemini-3.5-flash-lite\u003c/code\u003e.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Page","eyebrow":"03 · Page","meta":"6 min","html":"\n      \u003cp\u003e\u003ccode\u003eroam/index.html\u003c/code\u003e is the page people see. It has the title, the three mode buttons, the trip form, Run, the trace, Replay, and Download. It links \u003ccode\u003estyle.css\u003c/code\u003e and \u003ccode\u003eapp.js\u003c/code\u003e. It does not contain the API key, and it does not call Gemini by itself. Opening this file directly in the browser cannot reach the model. You will serve it later with \u003ccode\u003enpx vercel dev\u003c/code\u003e.\u003c/p\u003e\n      \u003cp\u003eCreate \u003ccode\u003eroam/index.html\u003c/code\u003e and paste the whole file. It is 135 lines.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/index.html\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/index.html\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003eTab icon\u003c/h2\u003e\n      \u003cp\u003eThe page also links \u003ccode\u003efavicon.svg\u003c/code\u003e. Paste this complete file as \u003ccode\u003eroam/favicon.svg\u003c/code\u003e so that link resolves. The matching \u003ccode\u003efavicon.ico\u003c/code\u003e in the repo is a binary icon, so it is not in a copy block. The planner works if the \u003ccode\u003e.ico\u003c/code\u003e file is missing.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/favicon.svg\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/favicon.svg\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003eBoth files are in \u003ccode\u003eroam/\u003c/code\u003e. The HTML file links \u003ccode\u003estyle.css\u003c/code\u003e and \u003ccode\u003eapp.js\u003c/code\u003e, which you will add next. Those links 404 until those chapters are done. That is expected.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Styles","eyebrow":"04 · Styles","meta":"5 min","html":"\n      \u003cp\u003e\u003ccode\u003eroam/style.css\u003c/code\u003e is the whole look of the demo. Cream background, white cards, sage when a mode is selected or a budget check passes, peach when a plan is over budget or a request fails. The page reads this file as-is. There is no CSS build step.\u003c/p\u003e\n      \u003cp\u003ePaste the complete file. It is 772 lines. Scroll inside the box to read it. Copy still copies every line, including the ones below the fold.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/style.css\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/style.css\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003e\u003ccode\u003eroam/style.css\u003c/code\u003e sits next to \u003ccode\u003eroam/index.html\u003c/code\u003e. You pasted the whole file, not a piece of a rule.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Browser app","eyebrow":"05 · Browser app","meta":"8 min","html":"\n      \u003cp\u003e\u003ccode\u003eroam/app.js\u003c/code\u003e is the program that runs in the browser. It sends the trip to \u003ccode\u003ePOST /api/agent\u003c/code\u003e, then draws each step in the trace. It also switches modes, plays a replay, and downloads the last live response. It does not decide prices, and it never sees \u003ccode\u003eGEMINI_API_KEY\u003c/code\u003e.\u003c/p\u003e\n      \u003cp\u003eA follow-up such as “Actually, my budget is now $25” sends the conversation and a slim plan: the plan id, the revision, and each stop's place id and time. The server looks the prices up again. A price typed into the box is just text.\u003c/p\u003e\n      \u003cp\u003eSwitching modes clears that saved history. The next Run starts fresh.\u003c/p\u003e\n      \u003cp\u003ePaste the complete file. It is 405 lines.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/app.js\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/app.js\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cdiv class=\"callout callout-tip\"\u003e\u003cp\u003e\u003cstrong\u003eThe budget box is the budget\u003c/strong\u003eThe follow-up sentence tells the model what you want. The number our code enforces is the Budget field. Change the field, then send the follow-up.\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003e\u003ccode\u003eroam/app.js\u003c/code\u003e is the full file. Search it for \u003ccode\u003eGEMINI_API_KEY\u003c/code\u003e. That name is not in this file. The key stays on the server.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Places, prompts, budget","eyebrow":"06 · Libraries","meta":"10 min","html":"\n      \u003cp\u003eThree small libraries live in \u003ccode\u003eroam/lib/\u003c/code\u003e. Paste each complete file into the path in its header. Together they are the facts the model is not allowed to invent.\u003c/p\u003e\n      \u003ch2\u003eplaces.js\u003c/h2\u003e\n      \u003cp\u003eThe place list. Names are real places in and around Bujumbura. Prices are made up for the demo. The trick cruise is in this file too. Its description tells the model the trip is free. \u003ccode\u003ecost_usd\u003c/code\u003e is still 25. The checker uses 25.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/lib/places.js\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/lib/places.js\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003eprompts.js\u003c/h2\u003e\n      \u003cp\u003eThe short instruction for each mode. Chat is told it has no tools. One Tool may call \u003ccode\u003esearch_places\u003c/code\u003e once. Agent must call \u003ccode\u003echeck_budget\u003c/code\u003e and must change the plan if the check fails. These sentences do not set prices. The next files do.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/lib/prompts.js\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/lib/prompts.js\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003ebudget.js\u003c/h2\u003e\n      \u003cp\u003eThe checker. The same stops and the same budget always produce the same total. Transport is $1 for every stop, including a free one. Prices come from \u003ccode\u003eplaces.js\u003c/code\u003e only. Text in a description is ignored.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/lib/budget.js\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/lib/budget.js\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003eThe receipt the talk uses\u003c/h2\u003e\n      \u003cp\u003eAdd the integers in \u003ccode\u003eplaces.js\u003c/code\u003e, plus $1 per stop. Do this yourself before you trust a paragraph from the model.\u003c/p\u003e\n      \u003cul\u003e\n        \u003cli\u003eBoat safari $30 + Club du Lac lunch $18 + Saga Beach $5 + transport $3 = \u003cstrong\u003e$56\u003c/strong\u003e. Over a $50 budget.\u003c/li\u003e\n        \u003cli\u003eSwap the safari for the riverside walk ($12). $12 + $18 + $5 + $3 = \u003cstrong\u003e$38\u003c/strong\u003e. Fits $50.\u003c/li\u003e\n        \u003cli\u003eOn a $25 budget: walk $12 + brochettes $8 + beach $5 + transport $3 = \u003cstrong\u003e$28\u003c/strong\u003e. Still over.\u003c/li\u003e\n        \u003cli\u003eSwap the walk for the Kiriri viewpoint ($0). $0 + $8 + $5 + $3 = \u003cstrong\u003e$16\u003c/strong\u003e. Fits $25. The viewpoint is free. Transport is not.\u003c/li\u003e\n      \u003c/ul\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003eIn \u003ccode\u003eplaces.js\u003c/code\u003e, the Kiriri viewpoint costs 0 and the cruise costs 25. In \u003ccode\u003ebudget.js\u003c/code\u003e, \u003ccode\u003eTRANSPORT_USD_PER_STOP\u003c/code\u003e is 1. Your $56 total matches the first bullet.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Tools","eyebrow":"07 · Tools","meta":"8 min","html":"\n      \u003cp\u003e\u003ccode\u003eroam/lib/tools.js\u003c/code\u003e is the list of tools each mode may ask for, and the code that actually runs them. The model never receives a result that this file did not build.\u003c/p\u003e\n      \u003ctable\u003e\n        \u003cthead\u003e\u003ctr\u003e\u003cth\u003eTool\u003c/th\u003e\u003cth\u003eWhat our code does\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n        \u003ctbody\u003e\n          \u003ctr\u003e\u003ctd\u003e\u003ccode\u003esearch_places\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eFilters the place list by category or max price. Descriptions are left out.\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003ctd\u003e\u003ccode\u003eget_place_details\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eReturns one place, including the description and the price from our list.\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003ctd\u003e\u003ccode\u003ecreate_itinerary\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eStarts a plan. If a plan already exists, it tells the model to call \u003ccode\u003eupdate_itinerary\u003c/code\u003e.\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003ctd\u003e\u003ccode\u003eupdate_itinerary\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eReplaces the stops, keeps the same plan id, and adds 1 to the revision.\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003ctd\u003e\u003ccode\u003echeck_budget\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAdds place prices plus $1 per stop. It only accepts the budget from the request.\u003c/td\u003e\u003c/tr\u003e\n        \u003c/tbody\u003e\n      \u003c/table\u003e\n      \u003cp\u003eChat's list is empty. One Tool may call \u003ccode\u003esearch_places\u003c/code\u003e only. Agent may call all five. If the model asks for a tool the mode does not have, this file returns a validation failure. The page does not crash. The model can read that failure and try something else, while steps remain.\u003c/p\u003e\n      \u003cp\u003ePaste the complete file. It is 331 lines.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/lib/tools.js\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/lib/tools.js\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003eIn the pasted file, \u003ccode\u003eMODE_TOOLS.chat\u003c/code\u003e is \u003ccode\u003e[]\u003c/code\u003e, \u003ccode\u003eone_tool\u003c/code\u003e is only \u003ccode\u003esearch_places\u003c/code\u003e, and \u003ccode\u003echeck_budget\u003c/code\u003e calls \u003ccode\u003eevaluateBudget\u003c/code\u003e. The model does not pass the prices in.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Agent function","eyebrow":"08 · Agent function","meta":"10 min","html":"\n      \u003cp\u003e\u003ccode\u003eroam/api/agent.js\u003c/code\u003e is the only server file. The browser posts \u003ccode\u003e{ mode, message, budget_usd, history, itinerary, trick }\u003c/code\u003e. This function checks the size, the passcode, and a small in-memory rate limit, then calls Gemini's \u003ccode\u003egenerateContent\u003c/code\u003e REST endpoint. The key travels in the \u003ccode\u003ex-goog-api-key\u003c/code\u003e header. There is no SDK.\u003c/p\u003e\n      \u003cp\u003eIf the reply asks for tools, this file checks the request, runs it with \u003ccode\u003eexecuteTool\u003c/code\u003e, and sends the result back. That repeats until the model answers in words, a tool is not allowed, a call takes too long, or the step cap is hit. The default cap is 8 tool steps. \u003ccode\u003eMAX_STEPS\u003c/code\u003e can lower or raise it. The hard maximum is 12.\u003c/p\u003e\n      \u003cp\u003eOne Tool is allowed one tool round. The next call turns function calling off so the model has to answer in words. Chat gets an empty tool list. If it tries to call a tool anyway, the run stops.\u003c/p\u003e\n      \u003cp\u003eGemini 3 attaches a \u003ccode\u003ethoughtSignature\u003c/code\u003e to function-call parts. This file sends the model's parts back unchanged, including that signature, and copies the call id onto our response. The page shows the tool request, our result, and the final answer. It does not show hidden reasoning.\u003c/p\u003e\n      \u003cp\u003e\u003ccode\u003eDEFAULT_MODEL\u003c/code\u003e inside this file is the fallback used only when \u003ccode\u003eGEMINI_MODEL\u003c/code\u003e is missing or invalid. Leave that line as it is. Your \u003ccode\u003e.env.example\u003c/code\u003e sets \u003ccode\u003eGEMINI_MODEL=gemini-3.5-flash-lite\u003c/code\u003e, and that value is the one this lab runs. Override the model with \u003ccode\u003eGEMINI_MODEL\u003c/code\u003e, not by rewriting this file.\u003c/p\u003e\n      \u003cp\u003eThe imports from \u003ccode\u003e../lib\u003c/code\u003e are normal static paths. Vercel follows them, which is why the libraries can stay outside \u003ccode\u003eapi/\u003c/code\u003e.\u003c/p\u003e\n      \u003cp\u003ePaste the complete file. It is 581 lines.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/api/agent.js\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/api/agent.js\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cdiv class=\"callout callout-tip\"\u003e\u003cp\u003e\u003cstrong\u003eStatus comes from the checker\u003c/strong\u003e\u003ccode\u003evalid\u003c/code\u003e means the latest plan passed \u003ccode\u003echeck_budget\u003c/code\u003e for this budget. \u003ccode\u003einvalid\u003c/code\u003e means the checker refused it. \u003ccode\u003eunverified\u003c/code\u003e means the model wrote an answer without a check for this plan. \u003ccode\u003eno_itinerary\u003c/code\u003e means there is no plan object. Chat always ends there.\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003eThe file is at \u003ccode\u003eroam/api/agent.js\u003c/code\u003e, not inside \u003ccode\u003elib/\u003c/code\u003e. It imports \u003ccode\u003e../lib/places.js\u003c/code\u003e, \u003ccode\u003e../lib/prompts.js\u003c/code\u003e, and \u003ccode\u003e../lib/tools.js\u003c/code\u003e. You have not put a real key in it.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Replays","eyebrow":"09 · Replays","meta":"6 min","html":"\n      \u003cp\u003eReplay plays a JSON file through the same step renderer as a live run. It does not call Gemini. The badge says \u003cstrong\u003e↺ REPLAY, NOT LIVE\u003c/strong\u003e. You still need the page to be served. A \u003ccode\u003efile://\u003c/code\u003e page often cannot load these files.\u003c/p\u003e\n      \u003ch2\u003escripted.json\u003c/h2\u003e\n      \u003cp\u003eThis is the \u003cstrong\u003eExample run\u003c/strong\u003e. It was written for the demo. It is not a recording of Gemini. The trace is an agent plan: the first budget check is over, the plan changes, and the next check passes. You should see a peach ✗ step and, after it, a sage ✓ step. Paste the complete file. It is 675 lines. Scroll inside the box. Copy copies the whole file.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/replays/scripted.json\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/replays/scripted.json\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003erecorded.json\u003c/h2\u003e\n      \u003cp\u003eThis is the \u003cstrong\u003eRecorded real run\u003c/strong\u003e slot. In this repo it is a placeholder. The page says \u003cstrong\u003eNo recording yet\u003c/strong\u003e. It does not contain an API key or a saved Gemini transcript. Paste it as-is.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/replays/recorded.json\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/replays/recorded.json\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cp\u003e\u003cstrong\u003eDownload this run\u003c/strong\u003e stays off until a live response arrives. It saves that response as \u003ccode\u003erecorded.json\u003c/code\u003e in the same shape. After a rehearsal you trust, you can replace \u003ccode\u003eroam/replays/recorded.json\u003c/code\u003e with that download. Do not invent a recording. This repo does not contain one.\u003c/p\u003e\n      \u003cdiv class=\"callout callout-tip\"\u003e\u003cp\u003e\u003cstrong\u003eThese two files are safe to paste\u003c/strong\u003eThey were checked before they were put in this lab. They hold demo JSON, not a key. Still do not drop your own key into them later.\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003eBoth files are under \u003ccode\u003eroam/replays/\u003c/code\u003e. \u003ccode\u003erecorded.json\u003c/code\u003e says \u003ccode\u003eNo recording yet\u003c/code\u003e. \u003ccode\u003escripted.json\u003c/code\u003e is much longer, because it is a full example trace.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Tests","eyebrow":"10 · Tests","meta":"10 min","html":"\n      \u003cp\u003eThe tests use Node's built-in runner, \u003ccode\u003enode:test\u003c/code\u003e. There is no Jest and no extra install. The agent-loop tests pass a fake model into \u003ccode\u003erunLoop\u003c/code\u003e, so they do not call Google and do not need a key. One test uses the string \u003ccode\u003esuper-secret-demo-key\u003c/code\u003e to prove a key is stripped out of the result. That string is a fixture, not a real credential. Paste it with the rest of the file.\u003c/p\u003e\n      \u003ch2\u003eagent-loop.test.js\u003c/h2\u003e\n      \u003cp\u003eCovers the loop, the step cap, model errors, and the rule that the key does not leak into the response.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/tests/agent-loop.test.js\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/tests/agent-loop.test.js\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003ebudget.test.js\u003c/h2\u003e\n      \u003cp\u003eCovers the checker: the same plan, the same total, transport on a free stop, and the trick place still costing what \u003ccode\u003eplaces.js\u003c/code\u003e says.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/tests/budget.test.js\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/tests/budget.test.js\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003etools.test.js\u003c/h2\u003e\n      \u003cp\u003eCovers which tools each mode may call, invalid arguments, and the itinerary rules.\u003c/p\u003e\n      \u003cdiv class=\"code-block\" data-file=\"roam/tests/tools.test.js\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eroam/tests/tools.test.js\u003c/span\u003e\u003cspan class=\"code-actions\"\u003e\u003cspan class=\"code-note\"\u003eComplete file\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/span\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003ch2\u003eRun them\u003c/h2\u003e\n      \u003cp\u003eFrom the \u003ccode\u003eroam/\u003c/code\u003e folder, the one that contains \u003ccode\u003epackage.json\u003c/code\u003e:\u003c/p\u003e\n      \u003cdiv class=\"code-block\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eTerminal, inside roam/\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003enpm test\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cp\u003eThat runs \u003ccode\u003enode --test\u003c/code\u003e. You do not need \u003ccode\u003eGEMINI_API_KEY\u003c/code\u003e for this. If a test fails, the usual cause is a file that was only partly pasted. Replace that file with the complete copy from its chapter and run the command again.\u003c/p\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003e\u003ccode\u003enpm test\u003c/code\u003e from \u003ccode\u003eroam/\u003c/code\u003e passes. No test asked you for an API key.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Run it","eyebrow":"11 · Run it","meta":"12 min","html":"\n      \u003cp\u003eThe code is pasted. The key is still not in any of those files. Create \u003ccode\u003eroam/.env.local\u003c/code\u003e yourself, on your machine. Copy the names from \u003ccode\u003eroam/.env.example\u003c/code\u003e. Replace only the key. Keep \u003ccode\u003eGEMINI_MODEL=gemini-3.5-flash-lite\u003c/code\u003e unless you are deliberately overriding it. \u003ccode\u003e.env.local\u003c/code\u003e is gitignored. Do not commit it, and do not paste the real key into this workshop page or back into \u003ccode\u003e.env.example\u003c/code\u003e.\u003c/p\u003e\n      \u003cdiv class=\"callout callout-warning\"\u003e\u003cp\u003e\u003cstrong\u003eWhere the key is allowed to live\u003c/strong\u003eOn your machine: \u003ccode\u003eroam/.env.local\u003c/code\u003e only. On Vercel: the project environment settings only. Nowhere else. The placeholder in the pasted \u003ccode\u003e.env.example\u003c/code\u003e stays a placeholder.\u003c/p\u003e\u003c/div\u003e\n      \u003cp\u003eFrom the \u003ccode\u003eroam/\u003c/code\u003e folder:\u003c/p\u003e\n      \u003cdiv class=\"code-block\"\u003e\u003cdiv class=\"code-block-header\"\u003e\u003cspan class=\"code-lang\"\u003eTerminal, inside roam/\u003c/span\u003e\u003cbutton type=\"button\" class=\"copy-btn\"\u003eCopy\u003c/button\u003e\u003c/div\u003e\u003cpre\u003e\u003ccode\u003enpx vercel dev\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n      \u003cp\u003eThe first time, the CLI may ask you to log in and link a directory. Stay in \u003ccode\u003eroam/\u003c/code\u003e, the folder that contains \u003ccode\u003epackage.json\u003c/code\u003e, \u003ccode\u003evercel.json\u003c/code\u003e, and \u003ccode\u003eapi/\u003c/code\u003e. Do not point it at the parent folder. Open the local URL it prints. If the page says the network failed, \u003ccode\u003evercel dev\u003c/code\u003e is not running, or you opened \u003ccode\u003eindex.html\u003c/code\u003e as a file.\u003c/p\u003e\n      \u003ch2\u003eDeploy\u003c/h2\u003e\n      \u003col\u003e\n        \u003cli\u003eImport the GitHub repo in Vercel, or deploy this folder.\u003c/li\u003e\n        \u003cli\u003eSet the project \u003cstrong\u003eRoot Directory\u003c/strong\u003e to \u003ccode\u003eroam\u003c/code\u003e.\u003c/li\u003e\n        \u003cli\u003eAdd \u003ccode\u003eGEMINI_API_KEY\u003c/code\u003e in the Vercel settings. Set \u003ccode\u003eGEMINI_MODEL\u003c/code\u003e to \u003ccode\u003egemini-3.5-flash-lite\u003c/code\u003e. Add \u003ccode\u003eDEMO_PASSCODE\u003c/code\u003e or \u003ccode\u003eMAX_STEPS\u003c/code\u003e only if you want to override those.\u003c/li\u003e\n        \u003cli\u003eDo not set a build command. There is no frontend build.\u003c/li\u003e\n      \u003c/ol\u003e\n      \u003cp\u003eIf \u003ccode\u003eDEMO_PASSCODE\u003c/code\u003e is set, the first Run returns “locked”. A passcode field appears. The value is stored in \u003ccode\u003esessionStorage\u003c/code\u003e for that tab only.\u003c/p\u003e\n      \u003cp\u003eThe function also counts requests in memory: 20 per 10 minutes per IP, on that warm instance only. A new instance starts at zero. It is a speed bump. The spending cap in AI Studio is the real cost guard.\u003c/p\u003e\n      \u003ch2\u003eChecklist\u003c/h2\u003e\n      \u003col\u003e\n        \u003cli\u003eChat: a written plan, and the line that nothing was checked.\u003c/li\u003e\n        \u003cli\u003eOne Tool: one \u003ccode\u003esearch_places\u003c/code\u003e step, then ⚠ Not checked.\u003c/li\u003e\n        \u003cli\u003eAgent: at least one tool step from our code, and a badge that matches the checker. ✓ only if the latest plan passed for this budget.\u003c/li\u003e\n        \u003cli\u003eExample replay: peach ✗ over budget, then sage ✓ within budget, plus the replay badge.\u003c/li\u003e\n        \u003cli\u003e\u003ccode\u003enpm test\u003c/code\u003e from \u003ccode\u003eroam/\u003c/code\u003e passes.\u003c/li\u003e\n        \u003cli\u003e\u003ccode\u003egit status\u003c/code\u003e does not list \u003ccode\u003e.env.local\u003c/code\u003e, and no committed file contains your real key.\u003c/li\u003e\n      \u003c/ol\u003e\n      \u003cdiv class=\"checkpoint\"\u003e\u003cp class=\"checkpoint-label\"\u003eCheck it\u003c/p\u003e\u003cp\u003eThe local URL from \u003ccode\u003enpx vercel dev\u003c/code\u003e loads the planner. The key is only in \u003ccode\u003e.env.local\u003c/code\u003e or in Vercel. The six checklist items match what you see.\u003c/p\u003e\u003c/div\u003e\n    "},{"title":"Done","eyebrow":"12 · Done","meta":"4 min","html":"\n      \u003cp\u003eYou now have the same Roam files as this repo. The interesting split is still the one the talk is about: the model asks, and our code decides.\u003c/p\u003e\n      \u003ch2\u003eWhat this demo does not do\u003c/h2\u003e\n      \u003cul\u003e\n        \u003cli\u003eIt does not book anything. Place names are real. Prices are made up.\u003c/li\u003e\n        \u003cli\u003eIt does not prove the model's prose. It proves the total, and only after \u003ccode\u003echeck_budget\u003c/code\u003e for this plan and this budget.\u003c/li\u003e\n        \u003cli\u003eIt does not share the rate limit across serverless instances. Set a spending cap in Google AI Studio.\u003c/li\u003e\n        \u003cli\u003eIt does not put the API key in the browser. Keep it that way if you extend the demo.\u003c/li\u003e\n        \u003cli\u003eIt does not ship a recording of Gemini. \u003ccode\u003ereplays/recorded.json\u003c/code\u003e is a placeholder until you download a live run you trust and replace that file.\u003c/li\u003e\n        \u003cli\u003eIt does not install a package. \u003ccode\u003enpm test\u003c/code\u003e is Node's own runner. \u003ccode\u003enpx vercel dev\u003c/code\u003e fetches the CLI when you run it.\u003c/li\u003e\n      \u003c/ul\u003e\n      \u003cdiv class=\"done-banner\"\u003e\n        \u003ch2\u003eYou're done\u003c/h2\u003e\n        \u003cp\u003eYou can point at the mode, the tool list, the loop, and the checker, and say which part is the model and which part is our code. That split is the talk.\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"link-grid\"\u003e\n        \u003ca class=\"link-card\" href=\"https://github.com/aymanissa-dev/indabaxburundi26\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eGitHub repo\u003cspan\u003eCompare your folder with roam/\u003c/span\u003e\u003c/a\u003e\n        \u003ca class=\"link-card\" href=\"https://indabaxburundi26.vercel.app\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLive demo\u003cspan\u003eThe three modes, on Vercel\u003c/span\u003e\u003c/a\u003e\n        \u003ca class=\"link-card\" href=\"https://aistudio.google.com/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eGoogle AI Studio\u003cspan\u003eKey and spending cap\u003c/span\u003e\u003c/a\u003e\n        \u003ca class=\"link-card\" href=\"https://vercel.com/docs/functions\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eVercel functions\u003cspan\u003eHow api/agent.js is served\u003c/span\u003e\u003c/a\u003e\n      \u003c/div\u003e\n      \u003cp\u003eBuilt for IndabaX Burundi 2026.\u003c/p\u003e\n    "}];

      const PROGRESS_KEY = "roam-codelab-progress-v2";
      const THEME_KEY = "roam-codelab-theme";
      let current = 0;

      function readJSON(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return fallback;
          return JSON.parse(raw);
        } catch {
          return fallback;
        }
      }

      function readDone() {
        const parsed = readJSON(PROGRESS_KEY, []);
        if (!Array.isArray(parsed)) return [];
        return parsed.filter((n) => Number.isInteger(n) && n >= 0 && n < chapters.length);
      }

      function renderSidebar() {
        const list = document.getElementById("chapterList");
        list.replaceChildren();
        const done = readDone();
        chapters.forEach((ch, i) => {
          const li = document.createElement("li");
          li.className = "chapter-item" + (i === current ? " active" : "") + (done.includes(i) ? " done" : "");
          const num = document.createElement("span");
          num.className = "chapter-num";
          const label = document.createElement("span");
          label.textContent = String(i).padStart(2, "0");
          num.append(label);
          const title = document.createElement("span");
          title.textContent = ch.title;
          li.append(num, title);
          li.addEventListener("click", () => goTo(i));
          list.append(li);
        });
        document.getElementById("progressText").textContent = done.length + " / " + chapters.length;
        document.getElementById("progressFill").style.width = (done.length / chapters.length) * 100 + "%";
      }

      function markDone(i) {
        const done = readDone();
        if (!done.includes(i)) {
          done.push(i);
          try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(done)); } catch { /* ignore */ }
        }
      }

      function renderContent() {
        const ch = chapters[current];
        const last = current === chapters.length - 1;
        const content = document.getElementById("content");
        content.innerHTML =
          '<p class="chapter-eyebrow"></p><h1 class="chapter-title"></h1><p class="chapter-meta"></p>' +
          ch.html +
          '<div class="nav-buttons"><button type="button" class="nav-btn" id="prevBtn">Previous</button><button type="button" class="nav-btn primary" id="nextBtn"></button></div>';
        fillFileBlocks(content);
        content.querySelector(".chapter-eyebrow").textContent = ch.eyebrow;
        content.querySelector(".chapter-title").textContent = ch.title;
        content.querySelector(".chapter-meta").textContent = ch.meta;
        const prev = document.getElementById("prevBtn");
        const next = document.getElementById("nextBtn");
        prev.disabled = current === 0;
        next.textContent = last ? "You're done" : "Next";
        next.disabled = last;
        document.getElementById("main").scrollTop = 0;
        markDone(current);
        renderSidebar();
      }

      function goTo(i) {
        if (i < 0 || i >= chapters.length) return;
        current = i;
        renderContent();
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("scrim").hidden = true;
      }

      function fallbackCopy(text) {
        try {
          const area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.top = "0";
          area.style.left = "0";
          area.style.opacity = "0";
          document.body.append(area);
          area.focus();
          area.select();
          area.setSelectionRange(0, area.value.length);
          const ok = document.execCommand("copy");
          area.remove();
          return ok;
        } catch {
          return false;
        }
      }

      function blockText(block) {
        const path = block.getAttribute("data-file");
        if (path && Object.prototype.hasOwnProperty.call(FILES, path)) return FILES[path];
        const code = block.querySelector("code");
        return code ? code.textContent : "";
      }

      function fillFileBlocks(root) {
        root.querySelectorAll(".code-block[data-file]").forEach((block) => {
          const path = block.getAttribute("data-file");
          const text = FILES[path];
          const code = block.querySelector("code");
          if (!code) return;
          if (typeof text !== "string") {
            code.textContent = "Missing workshop file: " + path;
            return;
          }
          code.textContent = text;
          const btn = block.querySelector(".copy-btn");
          if (btn) btn.setAttribute("aria-label", "Copy " + path);
        });
      }

      function copyCode(btn) {
        const block = btn.closest(".code-block");
        const code = blockText(block);
        const show = (label) => {
          btn.textContent = label;
          btn.classList.toggle("copied", label === "Copied");
          setTimeout(() => {
            btn.textContent = "Copy";
            btn.classList.remove("copied");
          }, 1600);
        };
        // Copy inside the click. The async clipboard API can reject after the
        // gesture ends, and a fallback started then does not succeed.
        if (fallbackCopy(code)) {
          show("Copied");
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(() => show("Copied")).catch(() => show("Copy failed"));
          return;
        }
        show("Copy failed");
      }

      document.getElementById("content").addEventListener("click", (event) => {
        const copy = event.target.closest(".copy-btn");
        if (copy) {
          copyCode(copy);
          return;
        }
        if (event.target.closest("#prevBtn")) goTo(current - 1);
        if (event.target.closest("#nextBtn")) goTo(current + 1);
      });

      document.getElementById("brandHome").addEventListener("click", () => goTo(0));
      document.getElementById("menuBtn").addEventListener("click", () => {
        document.getElementById("sidebar").classList.add("open");
        document.getElementById("scrim").hidden = false;
      });
      document.getElementById("scrim").addEventListener("click", () => {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("scrim").hidden = true;
      });

      const root = document.documentElement;
      const themeBtn = document.getElementById("themeToggle");
      const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>';
      const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        themeBtn.innerHTML = theme === "dark" ? sun : moon;
        themeBtn.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
      }
      let savedTheme = null;
      try { savedTheme = localStorage.getItem(THEME_KEY); } catch { /* ignore */ }
      applyTheme(savedTheme === "dark" ? "dark" : "light");
      themeBtn.addEventListener("click", () => {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem(THEME_KEY, next); } catch { /* ignore */ }
      });

      renderContent();
    </script>
  </body>
</html>
