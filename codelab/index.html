<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>Roam codelab — From Chatbots to AI Agents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html[data-theme="light"] {
        --bg: #f7f5f0;
        --bg-subtle: #f3f0e8;
        --surface: #fcfbf8;
        --surface-hover: #efece4;
        --text: #1a1916;
        --text-muted: #4e4a43;
        --text-subtle: #6e685e;
        --border: #e4dfd4;
        --border-strong: #cfc8ba;
        --sage: #2f5a40;
        --sage-soft: #e5f2e6;
        --sand: #f4ecd4;
        --code-bg: #f4f1ea;
        --on-sage: #ffffff;
      }
      html[data-theme="dark"] {
        --bg: #1b1a17;
        --bg-subtle: #23221e;
        --surface: #2a2925;
        --surface-hover: #34322c;
        --text: #f7f5f0;
        --text-muted: #c9c3b6;
        --text-subtle: #9c9588;
        --border: #3a3832;
        --border-strong: #524e45;
        --sage: #b7dcc4;
        --sage-soft: #24352b;
        --sand: #3a3424;
        --code-bg: #201f1c;
        --on-sage: #1a1916;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 16px;
        line-height: 1.5;
      }
      button, input { font: inherit; color: inherit; }
      a { color: inherit; }
      :focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
      .shell { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
      .sidebar {
        border-right: 1px solid var(--border);
        background: var(--bg-subtle);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .sidebar-top {
        padding: 18px 18px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .brand {
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.04em;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        color: var(--text);
      }
      .brand .dot {
        display: inline-block;
        width: 0.28em;
        height: 0.28em;
        margin-left: 0.08em;
        border-radius: 2px;
        background: var(--sage);
        vertical-align: 0.08em;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
      .icon-btn svg { width: 16px; height: 16px; }
      .progress-wrap { padding: 14px 18px; border-bottom: 1px solid var(--border); }
      .progress-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-subtle);
        margin: 0 0 8px;
        display: flex;
        justify-content: space-between;
        font-weight: 700;
      }
      .progress-track { height: 6px; border-radius: 999px; background: var(--surface-hover); overflow: hidden; }
      .progress-fill { height: 100%; width: 0; background: var(--sage); border-radius: 999px; }
      .chapter-list { list-style: none; margin: 0; padding: 10px; overflow: auto; flex: 1; }
      .chapter-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        font-size: 13.5px;
        color: var(--text-muted);
        cursor: pointer;
      }
      .chapter-item:hover { background: var(--surface-hover); color: var(--text); }
      .chapter-item.active { background: var(--sage-soft); color: var(--text); font-weight: 600; }
      .chapter-num {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--border-strong);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        flex-shrink: 0;
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      .chapter-item.done .chapter-num {
        background: var(--sage);
        border-color: var(--sage);
        color: var(--on-sage);
      }
      .chapter-item.done .chapter-num::before { content: "✓"; }
      .chapter-item.done .chapter-num span { display: none; }
      .sidebar-links {
        margin-top: auto;
        padding: 14px 18px 18px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sidebar-links a {
        font-size: 12.5px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
      }
      .sidebar-links a:hover { color: var(--sage); }
      .main { overflow-y: auto; height: 100vh; background: var(--bg); }
      .content { max-width: 760px; margin: 0 auto; padding: 48px 32px 100px; }
      .mobile-menu-btn { display: none; position: fixed; top: 14px; left: 14px; z-index: 20; }
      .scrim { display: none; }
      .chapter-eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--sage);
        margin: 0 0 8px;
        font-weight: 700;
      }
      .chapter-title { font-size: 32px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.03em; line-height: 1.15; }
      .chapter-meta { font-size: 13px; color: var(--text-subtle); margin: 0 0 28px; }
      .content h2 { font-size: 19px; font-weight: 700; margin: 32px 0 10px; letter-spacing: -0.02em; }
      .content h3 { font-size: 15px; font-weight: 700; margin: 22px 0 8px; }
      .content p, .content li { font-size: 15.5px; line-height: 1.7; color: var(--text-muted); }
      .content p { margin: 0 0 14px; }
      .content ul, .content ol { padding-left: 22px; margin: 0 0 14px; }
      .content li { margin-bottom: 6px; }
      .content strong { color: var(--text); }
      .content a.inline { color: var(--sage); font-weight: 600; }
      :not(pre) > code {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.88em;
        background: var(--code-bg);
        border: 1px solid var(--border);
        padding: 0.08em 0.35em;
        border-radius: 5px;
        color: var(--text);
      }
      .code-block { position: relative; margin: 0 0 18px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
      .code-block-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .code-lang { font-size: 11px; color: var(--text-subtle); letter-spacing: 0.04em; font-weight: 700; }
      .copy-btn {
        background: none;
        border: 0;
        color: var(--text-subtle);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
      }
      .copy-btn:hover { background: var(--surface-hover); color: var(--text); }
      .copy-btn.copied { color: var(--sage); }
      pre { margin: 0; padding: 14px 16px; background: var(--code-bg); overflow-x: auto; }
      pre code {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--text-muted);
        white-space: pre;
      }
      .callout { padding: 14px 16px; border-radius: 12px; margin: 0 0 18px; border: 1px solid; }
      .callout p { margin: 0; font-size: 14px; color: var(--text); line-height: 1.6; }
      .callout strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
      .callout-tip { background: var(--sage-soft); border-color: var(--sage); }
      .callout-warning { background: var(--sand); border-color: var(--border-strong); }
      .checkpoint { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 16px; margin: 22px 0; }
      .checkpoint-label {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-subtle);
      }
      .checkpoint p { margin: 0; font-size: 14.5px; }
      table { width: 100%; border-collapse: collapse; margin: 0 0 18px; font-size: 14.5px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--text-subtle); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
      td { color: var(--text-muted); }
      .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 18px; }
      .link-card {
        display: block;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        text-decoration: none;
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
      }
      .link-card span { display: block; margin-top: 2px; color: var(--text-subtle); font-size: 12px; font-weight: 500; }
      .link-card:hover { border-color: var(--sage); background: var(--sage-soft); }
      .done-banner {
        margin-top: 8px;
        padding: 18px 18px 16px;
        border-radius: 16px;
        background: var(--sage-soft);
        border: 1px solid var(--sage);
      }
      .done-banner h2 { margin-top: 0; }
      .nav-buttons {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 40px;
        padding-top: 22px;
        border-top: 1px solid var(--border);
      }
      .nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        border: 1px solid var(--border-strong);
        color: var(--text);
        background: var(--surface);
        cursor: pointer;
      }
      .nav-btn:hover { background: var(--surface-hover); }
      .nav-btn.primary { background: var(--sage); color: var(--on-sage); border-color: transparent; }
      .nav-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      @media (max-width: 860px) {
        .shell { grid-template-columns: 1fr; }
        .sidebar {
          position: fixed;
          inset: 0 18% 0 0;
          z-index: 30;
          transform: translateX(-105%);
        }
        .sidebar.open { transform: none; }
        .mobile-menu-btn { display: inline-flex; }
        .content { padding: 64px 20px 80px; }
        .scrim:not([hidden]) {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(26, 25, 22, 0.4);
          z-index: 25;
        }
      }
      @media (max-width: 600px) { .link-grid { grid-template-columns: 1fr; } }
      @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }
    </style>
  </head>
  <body>
    <div class="scrim" id="scrim" hidden></div>
    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Chapters">
        <div class="sidebar-top">
          <button type="button" class="brand" id="brandHome">Roam<span class="dot" aria-hidden="true"></span></button>
          <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          </button>
        </div>
        <div class="progress-wrap">
          <p class="progress-label"><span>Progress</span><span id="progressText">0 / 0</span></p>
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <ul class="chapter-list" id="chapterList"></ul>
        <nav class="sidebar-links" aria-label="Resources">
          <a href="https://github.com/aymanissa-dev/indabaxburundi26" target="_blank" rel="noopener noreferrer">GitHub repo</a>
          <a href="https://indabaxburundi26.vercel.app" target="_blank" rel="noopener noreferrer">Live demo</a>
          <a href="https://aistudio.google.com/" target="_blank" rel="noopener noreferrer">Google AI Studio</a>
          <a href="https://vercel.com/docs/functions" target="_blank" rel="noopener noreferrer">Vercel docs</a>
          <a href="https://ai.google.dev/gemini-api/docs" target="_blank" rel="noopener noreferrer">Gemini docs</a>
        </nav>
      </aside>
      <main class="main" id="main">
        <button type="button" class="icon-btn mobile-menu-btn" id="menuBtn" aria-label="Open chapters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="content" id="content"></div>
      </main>
    </div>
    <script>
      const chapters = [
        {
          title: "Welcome",
          eyebrow: "00 · Welcome",
          meta: "4 min",
          html: `
            <p>Roam is a one-day trip planner for Bujumbura. You give it a goal and a budget. Then you watch the same kind of model work in three ways. This workshop walks the finished project in this repo. You do not have to invent the files. You have to be able to point at them and say what each one is allowed to do.</p>
            <p>The talk is <strong>From Chatbots to AI Agents</strong>, IndabaX Burundi 2026. The live demo is <a class="inline" href="https://indabaxburundi26.vercel.app" target="_blank" rel="noopener noreferrer">indabaxburundi26.vercel.app</a>. This page is the workshop. GitHub Pages publishes the repository root, so the address of this file is <a class="inline" href="https://aymanissa-dev.github.io/indabaxburundi26/codelab/" target="_blank" rel="noopener noreferrer">/codelab/</a>.</p>
            <h2>Three modes, one model</h2>
            <table>
              <thead><tr><th>Mode</th><th>What it may do</th><th>What it may not do</th></tr></thead>
              <tbody>
                <tr><td>Chat</td><td>Write a plan in words</td><td>Use tools, or check a price</td></tr>
                <tr><td>One Tool</td><td>Call <code>search_places</code> once</td><td>Add the prices up, or revise the plan</td></tr>
                <tr><td>Agent</td><td>Look up places, write a plan, call <code>check_budget</code>, then change the plan and check again</td><td>Invent a total. The checker does that.</td></tr>
              </tbody>
            </table>
            <p>The whole idea is one sentence. <strong>The model asks. Our code decides.</strong> Gemini may request a tool. It does not run the tool, and it does not get to choose the price.</p>
            <div class="callout callout-tip"><p><strong>Real places, made-up prices</strong>The names in <code>roam/lib/places.js</code> are real places in and around Bujumbura. The dollar amounts are for the demo. This is not a booking system.</p></div>
            <div class="checkpoint"><p class="checkpoint-label">Check it</p><p>Say the three modes out loud, and say one thing each mode is not allowed to do.</p></div>
          `,
        },
        {
          title: "Prerequisites",
          eyebrow: "01 · Setup",
          meta: "8 min",
          html: `
            <p>You can read every chapter with no accounts. To run a live trip, you need three things.</p>
            <ol>
              <li><strong>Node.js 20 or newer.</strong> The tests use Node's built-in test runner. There is no extra test library to install.</li>
              <li><strong>A Gemini API key</strong> from <a class="inline" href="https://aistudio.google.com/" target="_blank" rel="noopener noreferrer">Google AI Studio</a>. The key is a password for the model. Set a small spending cap in AI Studio before you experiment. The cap is the real guard if a loop runs away.</li>
              <li><strong>A Vercel account</strong> if you want the same setup as the talk. Locally you use <code>npx vercel dev</code>. The Vercel CLI is not a dependency of this repo. <code>npx</code> downloads it when you ask.</li>
            </ol>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">Terminal</span><button type="button" class="copy-btn">Copy</button></div>
              <pre><code>node -v</code></pre>
            </div>
            <p>You want <code>v20</code> or higher. If the command is not found, install Node from the official site, then open a new terminal.</p>
            <div class="callout callout-warning"><p><strong>The key stays off the page</strong>Do not paste it into <code>index.html</code>, <code>app.js</code>, a slide, or a chat. The browser never receives <code>GEMINI_API_KEY</code>. You will put the placeholder names in <code>roam/.env.example</code> and the real value only in Vercel, or in <code>roam/.env.local</code> on your machine.</p></div>
            <p>A model name is not a secret. Use <code>gemini-3.5-flash-lite</code>. You can override it with <code>GEMINI_MODEL</code> if another Gemini Flash model works for you.</p>
            <div class="checkpoint"><p class="checkpoint-label">Check it</p><p><code>node -v</code> prints 20 or newer. You know where the key lives, and it is not in a file you would commit.</p></div>
          `,
        },
        {
          title: "Repo tour",
          eyebrow: "02 · The repo",
          meta: "7 min",
          html: `
            <p>The Vercel project root is the <code>roam/</code> folder, not the repository root. Open these four files first. They are the page, the look, the browser behavior, and the only server file.</p>
            <table>
              <thead><tr><th>File</th><th>Job</th></tr></thead>
              <tbody>
                <tr><td><code>roam/index.html</code></td><td>The page: three mode buttons, the trip form, Run, Replay, Download, and the trace.</td></tr>
                <tr><td><code>roam/style.css</code></td><td>Cream canvas, white cards, sage for a selected mode and a passing check, peach for over-budget and errors.</td></tr>
                <tr><td><code>roam/app.js</code></td><td>Sends the request, then draws each step. It does not decide prices.</td></tr>
                <tr><td><code>roam/api/agent.js</code></td><td>The Vercel function. It holds the key, calls Gemini, and runs tools.</td></tr>
              </tbody>
            </table>
            <p>The rules live next to the function, not inside it:</p>
            <ul>
              <li><code>roam/lib/places.js</code> — the place list and the made-up prices</li>
              <li><code>roam/lib/tools.js</code> — which tools each mode may ask for, and the code that runs them</li>
              <li><code>roam/lib/budget.js</code> — the checker. Same plan in, same total out</li>
              <li><code>roam/lib/prompts.js</code> — the short instruction for each mode</li>
              <li><code>roam/replays/</code> — saved runs the page can play without calling Gemini</li>
              <li><code>roam/tests/</code> — tests that use a fake model, so they need no key</li>
            </ul>
            <p><code>api/agent.js</code> imports <code>../lib</code> with normal static paths. Vercel follows those imports, so the libraries can stay outside <code>api/</code>.</p>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">roam/package.json</span><button type="button" class="copy-btn">Copy</button></div>
              <pre><code>{
  "name": "roam",
  "private": true,
  "type": "module",
  "scripts": {
    "test": "node --test"
  }
}</code></pre>
            </div>
            <p><code>"type": "module"</code> is why the server file can use <code>import</code>. There is no frontend build.</p>
            <div class="checkpoint"><p class="checkpoint-label">Check it</p><p>Open <code>roam/api/agent.js</code> and find the imports from <code>../lib</code>. Then say, in one sentence, why the API key is not in <code>app.js</code>.</p></div>
          `,
        },
        {
          title: "Chat mode",
          eyebrow: "03 · Chat",
          meta: "6 min",
          html: `
            <p>Chat is a conversation with someone who has never seen our price list. They can still sound sure. That is the point. We are not asking the model to lie. We are showing that it cannot check.</p>
            <p>Open <code>roam/lib/prompts.js</code>. The chat instruction is one sentence:</p>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">roam/lib/prompts.js</span><button type="button" class="copy-btn">Copy</button></div>
              <pre><code>You are a friendly trip planner for Bujumbura. Suggest a one-day plan within the user's budget. You have no tools.</code></pre>
            </div>
            <p>Open <code>roam/lib/tools.js</code> and find <code>MODE_TOOLS</code>. Chat's list is empty.</p>
            <div class="code-block">
              <div class="code-block-header"><span class="code-lang">roam/lib/tools.js</span><button type="button" class="copy-btn">Copy</button></div>
              <pre><code>export const MODE_TOOLS = {
  chat: [],
  one_tool: ["search_places"],
  agent: [
    "search_places",
    "get_place_details",
    "create_itinerary",
    "update_itinerary",
    "check_budget",
  ],
};</code></pre>
            </div>
            <p>In <code>roam/api/agent.js</code>, <code>runLoop</code> passes an empty tool list when the mode is chat. If the model tries to call a tool anyway, the function stops with: "The AI tried to use a tool that is turned off."</p>
            <p>On the page, chat does not draw a receipt. <code>app.js</code> shows the reply in a bubble and the line <strong>Nothing was checked. No tools were used.</strong> The status is <code>no_itinerary</code>, because there is no plan object.</p>
            <div class="callout callout-tip"><p><strong>Words are not a check</strong>A confident paragraph is still just a paragraph. Green on the page means our code ran <code>check_budget</code> and the plan fit. Chat never gets that green.</p></div>
            <div class="checkpoint"><p class="checkpoint-label">Check it</p><p>In <code>prompts.js</code>, the chat string says "You have no tools." In <code>MODE_TOOLS</code>, <code>chat</code> is <code>[]</code>.</p></div>
          `,
        },
        {
          title: "One-tool mode",
          eyebrow: "04 · One tool",
          meta: "7 min",
          html: `
            <p>One Tool may look at the place list a single time. The prices it sees are ours. Nobody adds them up, and <code>check_budget</code> is not in the list, so it cannot be called.</p>
            <p>In <code>runLoop</code>, the first model call includes <code>search_places</code>. After that tool round, <code>toolRounds</code> is at least 1, so the next call sets <code>forceAnswer</code>. Tools are turned off, and Gemini is called with function calling mode <code>NONE</code>. The model has to answer in words.</p>
            <p><code>search_places</code> does not return the long description. <code>summarizePlace</code> in <code>places.js</code> keeps the id, name, category, price, duration, and best time. The description stays hidden until <code>get_place_details</code>, and One Tool is not allowed to call that.</p>

        root.setAttribute("data-theme", theme);
        themeBtn.innerHTML = theme === "dark" ? sun : moon;
        themeBtn.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
      }
      let savedTheme = null;
      try { savedTheme = localStorage.getItem(THEME_KEY); } catch { /* ignore */ }
      applyTheme(savedTheme === "dark" ? "dark" : "light");
      themeBtn.addEventListener("click", () => {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem(THEME_KEY, next); } catch { /* ignore */ }
      });

      renderContent();
    </script>
  </body>
</html>
